name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and shellcheck
        run: tests/run.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cifs-utils and acl
        run: sudo apt-get update && sudo apt-get install -y cifs-utils acl
      - name: Mount tests against Samba in a container
        run: tests/integration/samba-test.sh

# End of File #
